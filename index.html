<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>U asked time</title>

    <link rel="stylesheet" href="css/start.css">
</head>

<body>

    <!-- ============================================================
         START SCREEN
         ============================================================ -->

    <main class="start-screen">

        <!-- 背景の装飾 -->
        <div class="background-grid"></div>
        <div class="background-glow"></div>


        <!-- ========================================================
             メインコンテンツ
             ======================================================== -->

        <section class="start-container">


            <!-- ----------------------------------------------------
                 タイトル
                 ---------------------------------------------------- -->

            <header class="title-area">

                <p class="title-sub">
                    WEB PUZZLE
                </p>

                <h1>
                    U asked time
                </h1>

                <p class="title-line">
                    — 時は、問いかける。 —
                </p>

            </header>


            <!-- ----------------------------------------------------
                 メイン画像
                 ---------------------------------------------------- -->

            <div class="main-image">

                <img
                    src="images/title.png"
                    alt="U asked time メインビジュアル"
                >

            </div>


            <!-- ----------------------------------------------------
                 説明
                 ---------------------------------------------------- -->

            <section class="description">

                <h2>
                    ABOUT
                </h2>


                <p>
                    宇宙謎とは試行と思考を重ね、
                    その裏に潜む法則を推測する謎解きのジャンルです。
                </p>

                <p>
                    まずは色々押して試してみましょう！
                </p>
                <p>
                    これはVRChat上で公開されている『I asked』という謎解きワールドを
                    少し改題してweb上でも遊べるようにしたものです。
                </p>

            </section>


            <!-- ----------------------------------------------------
                 START BUTTON
                 ---------------------------------------------------- -->

            <section class="start-area">

                <a
                    class="start-button"
                    href="game.html"
                >
                    <span class="start-button-main">
                        START
                    </span>

                    <span class="start-button-sub">
                        謎解きをはじめる
                    </span>

                </a>

            </section>


            <!-- ----------------------------------------------------
                 SNS / LINKS
                 ---------------------------------------------------- -->

            <section class="links-area">

                <!-- X -->
                <a
                    class="link-button x-button"
                    href="https://twitter.com/intent/tweet?text=%E3%80%8CU%20asked%20time%E3%80%8D%E3%81%AB%E6%8C%91%E6%88%A6%E3%81%97%E3%81%BE%E3%81%99%EF%BC%81%0A%23Uaskedtime"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="link-icon">𝕏</span>

                    <span>
                        <strong>POST ON X</strong>
                        <small>この謎に挑戦することをポスト</small>
                    </span>

                </a>


                <!-- 別サイト -->
                <a
                    class="link-button external-button"
                    href="https://yuarika.github.io/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="link-icon">↗</span>

                    <span>
                        <strong>OTHER SITE</strong>
                        <small>別のサイトを見る</small>
                    </span>

                </a>

            </section>


            <!-- ----------------------------------------------------
                 FOOTER
                 ---------------------------------------------------- -->

            <footer class="start-footer">

                <p>
                    U asked time
                </p>

            </footer>

        </section>

    </main>


</body>
</html>
