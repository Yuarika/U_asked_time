<!-- ============================================================
     STAGE CLEAR
     ============================================================ -->

<script>

    window.showStageClear = function(stage, character) {

        const overlay =
            document.getElementById("stageClearOverlay");

        const word =
            document.getElementById("stageClearWord");

        if (!overlay || !word) {
            return;
        }


        const stageWords = {

            1: "昔",

            2: "今",

            3: "明後日"

        };


        word.textContent =
            stageWords[stage] || character || "";


        overlay.classList.add("show");

        overlay.setAttribute(
            "aria-hidden",
            "false"
        );


        setTimeout(function() {

            overlay.classList.remove("show");

            overlay.setAttribute(
                "aria-hidden",
                "true"
            );

        }, 1200);

    };

</script>


<!-- ============================================================
     FINAL CLEAR
     ============================================================ -->

<script>

    (function() {

        const clearCard =
            document.getElementById("clear-card");

        const finalOverlay =
            document.getElementById("final-clear-overlay");

        if (!clearCard || !finalOverlay) {
            return;
        }


        function showFinalClear() {

            finalOverlay.classList.add("show");

            finalOverlay.setAttribute(
                "aria-hidden",
                "false"
            );

        }


        const observer =
            new MutationObserver(function() {

                if (!clearCard.hidden) {
                    showFinalClear();
                }

            });


        observer.observe(
            clearCard,
            {
                attributes: true,
                attributeFilter: ["hidden"]
            }
        );


        if (!clearCard.hidden) {
            showFinalClear();
        }


        <!-- ====================================================
             X SHARE BUTTON
             ==================================================== -->

        const shareButton =
            document.getElementById("share-clear-button");


        if (shareButton) {

            shareButton.addEventListener(
                "click",
                function() {

                    const text =
                        "宇宙謎「U asked time」をクリアしました！\n" +
                        "#宇宙謎 #U_asked\n" +
                        "@yuarikaa";


                    const startUrl =
                        "https://yuarika.github.io/U_asked_time/";


                    const shareUrl =
                        "https://twitter.com/intent/tweet" +
                        "?text=" +
                        encodeURIComponent(text) +
                        "&url=" +
                        encodeURIComponent(startUrl);


                    window.open(
                        shareUrl,
                        "_blank",
                        "noopener,noreferrer"
                    );

                }
            );

        }

    })();

</script>
